databases:
  - name: offerly-db
    databaseName: offerly
    user: offerly
    plan: free

services:
  - type: web
    name: offerly
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: offerly-db
          property: connectionString
